<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSR DATA - Login</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7ff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
width:90%;
max-width:350px;
background:#fff;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.15);
text-align:center;
}

h1{
color:#0d6efd;
margin-bottom:10px;
}

p{
color:#555;
margin-bottom:20px;
}

input{
width:100%;
padding:14px;
margin:10px 0;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:14px;
background:#0d6efd;
color:#fff;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#0b5ed7;
}

a{
display:block;
margin-top:15px;
text-decoration:none;
color:#0d6efd;
font-weight:bold;
}
</style>
</head>

<body>

<div class="box">
<h1>BSR DATA</h1>
<p>Login to your account</p>

<input type="text" placeholder="Phone Number">

<input type="password" placeholder="Password">

<button onclick="login()">LOGIN</button>

<a href="#">Create Account</a>
</div>

<script>
function login(){
window.location.href="index.html";
}
</script>

</body>
</html>
