<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buy Data</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="topbar">
    <h2>📶 Buy Data</h2>
</div>

<div class="container">

<div class="form-card">

<label>Network</label>
<select id="network">
<option>MTN</option>
<option>Airtel</option>
<option>Glo</option>
<option>9mobile</option>
</select>

<label>Phone Number</label>
<input type="tel" placeholder="08012345678">

<label>Data Plan</label>
<select id="plan">
<option>500MB - ₦75</option>
<option>1GB - ₦135</option>
<option>2GB - ₦270</option>
<option>5GB - ₦675</option>
</select>

<div class="amount">
<h3>Amount</h3>
<h2>₦135</h2>
</div>

<button class="buy-btn" onclick="buyData()">
BUY NOW
</button>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
