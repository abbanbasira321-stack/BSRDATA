<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BSR DATA - Fund Wallet</title>

<link rel="stylesheet" href="style.css">

<style>

body {
    margin: 0;
    background: #f4f7fc;
    font-family: Arial, sans-serif;
    padding-bottom: 90px;
    color: #172033;
}

.topbar {
    background: linear-gradient(135deg, #1769c2, #0755c9);
    color: white;
    padding: 28px 25px;
    border-radius: 0 0 35px 35px;
}

.topbar h2 {
    margin: 0;
    font-size: 30px;
}

.container {
    padding: 22px;
}

/* INTRO */

.intro-card {
    background: white;
    border-radius: 26px;
    padding: 25px;
    margin-bottom: 18px;
    box-shadow: 0 8px 25px rgba(0,0,0,.08);
}

.intro-icon {
    font-size: 50px;
    margin-bottom: 8px;
}

.intro-card h2 {
    margin: 5px 0;
    font-size: 26px;
}

.intro-card p {
    margin: 8px 0 0;
    color: #707070;
    font-size: 16px;
    line-height: 1.5;
}

/* BANK CARD */

.bank-card {
    background: linear-gradient(135deg, #1769c2, #0755c9);
    color: white;
    border-radius: 28px;
    padding: 25px;
    box-shadow: 0 10px 28px rgba(23,105,194,.25);
    margin-bottom: 20px;
}

.bank-title {
    font-size: 21px;
    font-weight: bold;
    margin-bottom: 20px;
}

.bank-item {
    background: rgba(255,255,255,.12);
    border-radius: 17px;
    padding: 15px;
    margin-top: 12px;
}

.bank-item small {
    display: block;
    opacity: .8;
    margin-bottom: 5px;
}

.bank-item strong {
    font-size: 19px;
}

.account-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.copy-btn {
    border: none;
    background: white;
    color: #1769c2;
    border-radius: 12px;
    padding: 9px 12px;
    font-weight: bold;
}

/* FORM */

.form-card {
    background: white;
    border-radius: 28px;
    padding: 25px;
    box-shadow: 0 8px 25px rgba(0,0,0,.08);
}

.form-card h2 {
    margin-top: 0;
    font-size: 25px;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 18px;
    margin-bottom: 8px;
}

input {
    width: 100%;
    box-sizing: border-box;
    padding: 16px;
    border: 2px solid #e1e6ef;
    border-radius: 15px;
    font-size: 17px;
    outline: none;
}

input:focus {
    border-color: #1769c2;
}

.quick-amounts {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
    margin-top: 10px;
}

.quick-amounts button {
    border: none;
    background: #eef5ff;
    color: #1769c2;
    border-radius: 12px;
    padding: 12px 5px;
    font-weight: bold;
}

.submit-btn {
    width: 100%;
    border: none;
    margin-top: 22px;
    padding: 17px;
    border-radius: 16px;
    background: #1769c2;
    color: white;
    font-size: 18px;
    font-weight: bold;
}

.submit-btn:disabled {
    opacity: .6;
}

/* MESSAGE */

#message {
    margin-top: 16px;
    padding: 14px;
    border-radius: 14px;
    line-height: 1.5;
    display: none;
}

#message.success {
    display: block;
    background: #e8f8ef;
    color: #198754;
}

#message.error {
    display: block;
    background: #fdecec;
    color: #dc3545;
}

/* BOTTOM NAV */

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 78px;
    background: white;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 -5px 20px rgba(0,0,0,.12);
    z-index: 1000;
}

.bottom-nav div {
    text-align: center;
    color: #777;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.bottom-nav .active {
    color: #1769c2;
}

</style>
</head>

<body>

<div class="topbar">
    <h2>💰 Fund Wallet</h2>
</div>

<div class="container">

    <div class="intro-card">
        <div class="intro-icon">💳</div>
        <h2>Add Money to Wallet</h2>
        <p>
            Transfer money to the BSR DATA account below,
            then submit your payment reference.
        </p>
    </div>

    <div class="bank-card">

        <div class="bank-title">
            🏦 Bank Transfer Details
        </div>

        <div class="bank-item">
            <small>Bank</small>
            <strong>OPay</strong>
        </div>

        <div class="bank-item">
            <small>Account Name</small>
            <strong>Yahaya Muazu</strong>
        </div>

        <div class="bank-item">

            <small>Account Number</small>

            <div class="account-row">

                <strong id="accountNumber">
                    9025851659
                </strong>

                <button
                    class="copy-btn"
                    type="button"
                    onclick="copyAccount()">
                    📋 COPY
                </button>

            </div>

        </div>

    </div>

    <div class="form-card">

        <h2>💵 Payment Details</h2>

        <label for="amount">
            Amount Paid
        </label>

        <input
            id="amount"
            type="number"
            min="100"
            placeholder="Enter amount"
        >

        <div class="quick-amounts">

            <button type="button" onclick="setAmount(500)">
                ₦500
            </button>

            <button type="button" onclick="setAmount(1000)">
                ₦1,000
            </button>

            <button type="button" onclick="setAmount(2000)">
                ₦2,000
            </button>

            <button type="button" onclick="setAmount(5000)">
                ₦5,000
            </button>

            <button type="button" onclick="setAmount(10000)">
                ₦10,000
            </button>

            <button type="button" onclick="setAmount(20000)">
                ₦20,000
            </button>

        </div>

        <label for="reference">
            Transaction Reference
        </label>

        <input
            id="reference"
            type="text"
            placeholder="Enter transaction reference"
        >

        <button
            id="submitBtn"
            class="submit-btn"
            type="button">
            💰 SUBMIT PAYMENT
        </button>

        <div id="message"></div>

    </div>

</div>

<nav class="bottom-nav">

    <div onclick="location.href='index.html'">
        🏠<br>
        Home
    </div>

    <div
        class="active"
        onclick="location.href='wallet.html'">
        💳<br>
        Wallet
    </div>

    <div onclick="location.href='history.html'">
        📜<br>
        History
    </div>

    <div onclick="location.href='profile.html'">
        👤<br>
        Profile
    </div>

</nav>

<script>

const amountInput =
    document.getElementById("amount");

const phone =
    localStorage.getItem("userPhone") ||
    "09025851659";

const referenceInput =
    document.getElementById("reference");

const submitBtn =
    document.getElementById("submitBtn");

const message =
    document.getElementById("message");


function setAmount(amount) {

    amountInput.value = amount;

    amountInput.focus();

}


function copyAccount() {

    const account =
        document.getElementById(
            "accountNumber"
        ).textContent.trim();

    navigator.clipboard
        .writeText(account)
        .then(function () {

            alert(
                "Account number copied: " +
                account
            );

        })
        .catch(function () {

            alert(
                "Account Number: " +
                account
            );

        });

}


function messageShow(
    text,
    type = ""
) {

    message.textContent = text;

    message.className = type;

}


submitBtn.addEventListener(
    "click",
    async function () {

        const amount =
            amountInput.value.trim();

        const reference =
            referenceInput.value.trim();


        if (
            !amount ||
            Number(amount) < 100
        ) {

            messageShow(
                "Enter a valid amount. Minimum is ₦100.",
                "error"
            );

            return;

        }


        if (!reference) {

            messageShow(
                "Enter your transaction reference.",
                "error"
            );

            return;

        }


        submitBtn.disabled = true;

        submitBtn.textContent =
            "⏳ SUBMITTING...";


        messageShow(
            "Submitting payment..."
        );


        try {

            const response =
                await fetch(
                    "/api/fundwallet",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            phone: phone,
                            amount: amount,
                            reference: reference
                        })
                    }
                );


            const result =
                await response.json();


            console.log(
                "FUND RESPONSE:",
                result
            );


            if (
                result.status === "PENDING"
            ) {

                messageShow(
                    "✅ Payment submitted successfully. " +
                    "Payment ID: " +
                    result.paymentID +
                    ". Waiting for confirmation.",
                    "success"
                );

                amountInput.value = "";

                referenceInput.value = "";

            } else {

                messageShow(
                    result.message ||
                    "Payment submission failed.",
                    "error"
                );

            }

        } catch (error) {

            console.error(
                "FUND ERROR:",
                error
            );

            messageShow(
                "Unable to connect to BSR DATA server.",
                "error"
            );

        } finally {

            submitBtn.disabled = false;

            submitBtn.textContent =
                "💰 SUBMIT PAYMENT";

        }

    }
);

</script>

</body>
</html>
